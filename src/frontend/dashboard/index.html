<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0706" />
    <title>Burning Activity Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="t3">
    <a class="skip" href="#g-main">Skip to the results</a>

    <header class="g-top" id="top">
      <a class="g-brand" href="/" aria-label="Bara, home">
        <img class="g-logo" src="/brand/bara-wordmark.png" alt="" width="983" height="247" />
      </a>
      <div class="g-filters" role="group" aria-label="Filters">
        <div class="seg hf-dn" role="group" aria-label="Detections counted" title="Count detections made by day, by night or both">
          <button type="button" class="seg-btn" data-dn="all" aria-pressed="true">All</button>
          <button type="button" class="seg-btn" data-dn="day" aria-pressed="false">Day</button>
          <button type="button" class="seg-btn" data-dn="night" aria-pressed="false">Night</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
        <div class="seg hf-ht" role="group" aria-label="Hotspot types counted" title="Count presumed vegetation fires only, or every hotspot type including volcanoes and gas flares">
          <button type="button" class="seg-btn" data-ht="vegetation" aria-pressed="true" aria-label="Vegetation fires">Vegetation</button>
          <button type="button" class="seg-btn" data-ht="all" aria-pressed="false" aria-label="All hotspot types">All types</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
        <div class="seg hf-mode" role="group" aria-label="Area selection mode">
          <button type="button" class="seg-btn" data-mode="area" aria-pressed="true">Area</button>
          <button type="button" class="seg-btn" data-mode="polygon" aria-pressed="false">Polygon</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
        <div class="hf-area" id="area-picker"></div>
        <div class="hf-palette" id="palette-menu"></div>
      </div>
      <div class="g-export">
        <button type="button" class="pill" id="dl-detections" aria-label="Download raw detections CSV" title="Every satellite detection in the selected area and dates, with its source">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>CSV
        </button>
        <p class="dl-note" id="dl-note" role="status" aria-live="polite"></p>
      </div>
    </header>

    <main>
      <h1 class="visually-hidden">Burning Activity Calendar</h1>
      <section class="g-stage" id="overview" aria-label="Overview">
        <div class="g-map">
          <div id="map" tabindex="0" aria-label="Map of active fire cells for the selected area and dates"></div>
          <div class="g-shade" aria-hidden="true"></div>
          <div class="g-time" role="group" aria-label="Dates and map timeline">
            <div class="tl-dates"><div id="date-from"></div><div id="date-to"></div></div>
            <div class="tl" id="time-slider"></div>
          </div>
        </div>

        <div class="g-tools" role="group" aria-label="Map tools">
          <button type="button" class="pill pill-glass" id="draw-start" hidden>
            <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18l4-12 10 4-6 9z" /></svg><span id="draw-start-label">Draw polygon</span>
          </button>
          <p class="draw-tip" id="draw-tip" role="status" hidden></p>
          <p class="map-caution" id="dn-caution" role="note" hidden>Night only: quiet months read high, because Aqua records few hotspots at night.</p>
          <button type="button" class="pill pill-glass" id="draw-finish" hidden disabled>Finish</button>
          <button type="button" class="pill pill-glass" id="draw-cancel" hidden>Cancel</button>
          <button type="button" class="pill pill-glass" id="draw-clear" hidden>Clear polygon</button>
        </div>

        <button type="button" class="pill map-reset" id="reset-view">
          <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4 4v5h5" /></svg>Reset view
        </button>

        <div class="g-main" id="g-main">
          <div class="g-col g-left">
            <article class="gc" data-card="analytics" id="analytics-card" aria-labelledby="c-analytics">
              <div class="gc-head">
                <h2 class="gc-title" id="c-analytics">Historical analytics</h2>
              </div>
              <div class="gc-body" id="an-summary" aria-busy="true"></div>
            </article>
            <article class="gc" data-card="events" id="events-card" data-foldable aria-labelledby="c-events">
              <div class="gc-head"><h2 class="gc-title" id="c-events">Largest fire events</h2></div>
              <div class="gc-body" id="events" aria-busy="true"></div>
            </article>
          </div>

          <div class="g-col g-right">
            <p class="col-cap">All years</p>
            <article class="gc" data-card="calendar" id="calendar-card" aria-labelledby="c-calendar">
              <div class="gc-head">
                <h2 class="gc-title" id="c-calendar">Burning activity calendar</h2>
                <div class="card-actions">
                  <button type="button" class="pill pill-xs" data-export="calendar" data-format="csv">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>CSV
                  </button>
                </div>
              </div>
              <div class="gc-body" id="calendar" aria-busy="true"></div>
            </article>
            <article class="gc" data-card="patterns" id="patterns-card" aria-labelledby="c-patterns">
              <div class="gc-head"><h2 class="gc-title" id="c-patterns">Historical patterns</h2></div>
              <div class="gc-body an-patterns" id="an-patterns" aria-busy="true"></div>
            </article>
            <article class="gc" data-card="anomaly" data-expandable id="anomaly-card" aria-labelledby="c-anomaly">
              <div class="gc-head">
                <h2 class="gc-title" id="c-anomaly">Historical comparison</h2>
                <div class="card-actions">
                  <button type="button" class="pill pill-xs" data-export="anomaly" data-format="csv">CSV</button>
                  <button type="button" class="pill pill-xs" data-export="anomaly" data-format="png">PNG</button>
                </div>
              </div>
              <div class="gc-body" id="anomaly" aria-busy="true"></div>
            </article>
            <article class="gc" data-card="agreement" id="agreement-card" aria-labelledby="c-agreement">
              <div class="gc-head"><h2 class="gc-title" id="c-agreement">Do MODIS and VIIRS agree here?</h2></div>
              <div class="gc-body" id="agreement" aria-busy="true"></div>
            </article>
          </div>

          <nav class="g-rail g-rail-right" aria-label="Cards for all years">
            <button type="button" class="rail-btn" data-open="calendar" aria-controls="calendar-card" aria-expanded="false" aria-label="Burning activity calendar" title="Burning activity calendar">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4" /></svg>
            </button>
            <button type="button" class="rail-btn" data-open="patterns" aria-controls="patterns-card" aria-expanded="false" aria-label="Historical patterns" title="Historical patterns">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" /></svg>
            </button>
            <button type="button" class="rail-btn" data-open="anomaly" aria-controls="anomaly-card" aria-expanded="false" aria-label="Historical comparison" title="Historical comparison">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg>
            </button>
            <button type="button" class="rail-btn" data-open="agreement" aria-controls="agreement-card" aria-expanded="false" aria-label="Do MODIS and VIIRS agree here?" title="Do MODIS and VIIRS agree here?">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 12l2.5 2.5 4.5-5M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18" /></svg>
            </button>
          </nav>

        </div>

        <div class="g-foot">
          <div class="map-legend" id="map-legend"></div>
        </div>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
